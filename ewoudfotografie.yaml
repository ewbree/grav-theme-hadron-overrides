streams:
  schemes:
    theme:
      type: ReadOnlyStream
      prefixes:
        '':
          - user/themes/ewoudfotografie
          - user/themes/hadron
          - user/themes/quark2

# The site is light-only. See js/theme-toggle.js for the runtime enforcement.
theme-mode: light
accent-color: '#242424'

header-fixed: true
header-animated: false
header-transparent: false
sticky-footer: true
hide_title: false

dropdown:
  enabled: true
custommenus:
  enabled: true
menu: []

fontawesome:
  enabled: true
  local: false

# Monolingual site: the switcher is off, matching the previous Hadron setup.
# The partial and translations are still present if you ever add a language.
langswitcher:
  enable: false
  display: inline
  format: icon

blog-page: /blog
h5pembedrootpath: 'https://h5p.org/h5p/embed/'
